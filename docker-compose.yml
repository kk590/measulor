services:
  measulor:
    build: .
    container_name: measulor-app
    env_file: .env
    expose:
      - "5000"
    volumes:
      - measulor-data:/app/data
    restart: unless-stopped
    networks:
      - measulor-network

  nginx:
    image: nginx:alpine
    container_name: measulor-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - measulor
    networks:
      - measulor-network
    restart: unless-stopped

networks:
  measulor-network:
    driver: bridge

volumes:
  measulor-data:
